<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Catatan Kuliah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      #editor-container {
        height: 350px;
      }
      .ql-editor {
        font-size: 16px;
      }
      /* CSS untuk membatasi tinggi editor di mobile */
      @media (max-width: 640px) {
        #editor-container {
          height: 250px;
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 flex h-screen overflow-hidden font-sans">
    <aside
      id="sidebar"
      class="fixed inset-y-0 left-0 z-50 w-64 bg-indigo-900 text-white flex flex-col shadow-xl transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0 md:w-72"
    >
      <div
        class="p-6 text-2xl font-bold border-b border-indigo-800 flex items-center justify-between gap-2"
      >
        <span>📚 MyNotes</span>
        <button onclick="toggleSidebar()" class="md:hidden text-white">
          &times;
        </button>
      </div>
      <div class="p-4 border-b border-indigo-800">
        <input
          id="newMK"
          type="text"
          placeholder="Tambah MK..."
          class="w-full p-2 text-black rounded text-sm"
        />
        <button
          onclick="addSubject()"
          class="w-full mt-2 bg-emerald-500 hover:bg-emerald-600 py-2 rounded text-sm font-bold"
        >
          ＋ Tambah MK
        </button>
      </div>
      <nav
        id="listMK"
        class="flex-1 overflow-y-auto p-4 space-y-2 text-sm"
      ></nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
      <header
        class="bg-white shadow-md p-3 flex justify-between items-center px-3 md:px-8"
      >
        <div class="flex items-center gap-2">
          <button
            onclick="toggleSidebar()"
            class="md:hidden text-indigo-900 p-1"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              ></path>
            </svg>
          </button>
          <div>
            <h2
              id="currentTitle"
              class="text-sm md:text-xl font-bold text-gray-800 truncate"
            >
              Pilih MK
            </h2>
            <p id="subTitle" class="text-xs md:text-sm text-gray-500">
              Pilih mata kuliah
            </p>
          </div>
        </div>

        <div id="controls" class="hidden flex items-center gap-1">
          <select
            id="meetSelect"
            class="border p-1 rounded text-xs md:text-sm bg-gray-50"
            onchange="loadExistingNote()"
          >
            <option value="" selected disabled>Ptm</option>
            <script>
              for (let i = 1; i <= 16; i++)
                document.write(`<option value="${i}">${i}</option>`);
            </script>
          </select>
          <button
            onclick="saveNote()"
            class="bg-indigo-600 text-white px-2 py-1 rounded text-xs md:text-sm font-bold"
          >
            Simpan
          </button>
          <button
            onclick="showRekap()"
            class="bg-amber-500 text-white px-2 py-1 rounded text-xs md:text-sm font-bold"
          >
            Rekap
          </button>
          <button
            onclick="cetakPDF()"
            class="bg-red-500 text-white px-2 py-1 rounded text-xs md:text-sm font-bold"
          >
            PDF
          </button>
        </div>
      </header>

      <div class="flex-1 p-3 md:p-6 overflow-y-auto bg-gray-50">
        <div id="editor-wrapper" class="hidden">
          <div
            id="editor-container"
            class="bg-white shadow-lg rounded-lg overflow-hidden"
          ></div>
        </div>
        <div id="recap-container" class="hidden space-y-4"></div>
      </div>
    </main>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
      const WEB_APP_URL =
        "https://script.google.com/macros/s/AKfycbyWo81Oshs4QrsnQAWcGjh2cwZFBm24xqEA6WOyxl3ztAlqysrgLOw2J2waoBL3sgf5/exec";
      var quill = new Quill("#editor-container", { theme: "snow" });
      let selectedMK = "";
      let allNotes = [];

      // Fungsi untuk membuka/menutup sidebar di mobile
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("-translate-x-full");
      }

      function refresh() {
        fetch(WEB_APP_URL)
          .then((res) => res.json())
          .then((data) => {
            allNotes = data.catatan;
            const nav = document.getElementById("listMK");
            if (!data.mk || data.mk.length === 0) {
              nav.innerHTML =
                '<p class="text-indigo-300 text-xs">Belum ada MK.</p>';
              return;
            }
            nav.innerHTML = data.mk
              .map(
                (m) =>
                  `<div onclick="selectMK('${m[0]}'); toggleSidebar();" class="cursor-pointer p-3 hover:bg-indigo-800 rounded-lg truncate">📘 ${m[0]}</div>`,
              )
              .join("");
          });
      }

      function selectMK(name) {
        selectedMK = name;
        document.getElementById("currentTitle").innerText = name;
        document.getElementById("subTitle").innerText = "Sedang mengedit";
        document.getElementById("controls").classList.remove("hidden");
        document.getElementById("editor-wrapper").classList.remove("hidden");
        document.getElementById("recap-container").classList.add("hidden");
        document.getElementById("meetSelect").value = "";
        quill.root.innerHTML = "";
      }

      function loadExistingNote() {
        const ptm = document.getElementById("meetSelect").value;
        const notes = allNotes.filter(
          (n) => n[0] === selectedMK && n[1] == ptm,
        );
        if (notes.length > 0) {
          const lastNote = notes[notes.length - 1];
          quill.root.innerHTML = lastNote[2];
        } else {
          quill.root.innerHTML = "";
        }
      }

      function addSubject() {
        const input = document.getElementById("newMK");
        if (!input.value) return alert("Isi nama MK!");
        fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ action: "tambahMK", name: input.value }),
        }).then(() => {
          input.value = "";
          refresh();
        });
      }

      function saveNote() {
        const ptm = document.getElementById("meetSelect").value;
        if (!ptm) return alert("Pilih pertemuan!");
        const data = {
          action: "simpanCatatan",
          mk: selectedMK,
          pertemuan: ptm,
          konten: quill.root.innerHTML,
        };
        fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(data),
        }).then(() => {
          alert("Catatan tersimpan!");
          refresh();
        });
      }

      function showRekap() {
        document.getElementById("editor-wrapper").classList.add("hidden");
        document.getElementById("recap-container").classList.remove("hidden");
        const recapDiv = document.getElementById("recap-container");
        const filtered = allNotes.filter((n) => n[0] === selectedMK);
        recapDiv.innerHTML = `<h3 class="text-xl font-bold">Rekap: ${selectedMK}</h3>`;
        if (filtered.length === 0) {
          recapDiv.innerHTML += `<p class="text-gray-500">Belum ada catatan.</p>`;
        } else {
          filtered
            .sort((a, b) => parseInt(a[1]) - parseInt(b[1]))
            .forEach((n) => {
              recapDiv.innerHTML += `
              <div class="bg-white p-4 rounded-lg shadow-sm">
                <h4 class="font-bold text-indigo-700">Pertemuan ${n[1]}</h4>
                <div class="text-sm mt-2">${n[2]}</div>
              </div>`;
            });
        }
      }

      function cetakPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF("p", "mm", "a4");
        const logoUrl =
          "https://cdn-sdotid.adg.id/images/55c9e2f3-8096-495a-9345-f9e10fdbd455_980x979.png";
        let y = 15;
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = logoUrl;
        img.onload = () => {
          doc.addImage(img, "PNG", 10, 10, 20, 20);
          doc.setFontSize(18);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(30, 30, 80);
          doc.text(`Catatan Kuliah: ${selectedMK}`, 35, 20);
          doc.setFontSize(12);
          doc.setFont("helvetica", "normal");
          doc.setTextColor(100, 100, 100);
          doc.text(`Julia Hata`, 35, 28);
          doc.setDrawColor(200, 200, 200);
          doc.line(10, 35, 200, 35);
          y = 45;
          const filtered = allNotes.filter((n) => n[0] === selectedMK);
          filtered
            .sort((a, b) => parseInt(a[1]) - parseInt(b[1]))
            .forEach((n) => {
              if (y > 270) {
                doc.addPage();
                y = 20;
              }
              doc.setFontSize(14);
              doc.setFont("helvetica", "bold");
              doc.setTextColor(60, 60, 150);
              doc.text(`Pertemuan ${n[1]}`, 10, y);
              y += 8;
              doc.setFontSize(11);
              doc.setFont("helvetica", "normal");
              doc.setTextColor(0, 0, 0);
              const container = document.createElement("div");
              container.innerHTML = n[2];
              const elements = container.querySelectorAll(
                "p, ul, ol, blockquote, h1, h2, h3",
              );
              elements.forEach((el) => {
                let text = el.innerText;
                if (el.tagName === "UL" || el.tagName === "OL") {
                  const items = el.querySelectorAll("li");
                  items.forEach((li, index) => {
                    const prefix =
                      el.tagName === "OL" ? `${index + 1}. ` : "• ";
                    if (y > 280) {
                      doc.addPage();
                      y = 20;
                    }
                    doc.text(prefix + li.innerText, 15, y, { maxWidth: 180 });
                    y += 6;
                  });
                  y += 2;
                } else {
                  if (y > 280) {
                    doc.addPage();
                    y = 20;
                  }
                  doc.text(text, 10, y, { maxWidth: 190 });
                  y += 8;
                }
              });
              y += 10;
            });
          doc.save(`Catatan_${selectedMK}.pdf`);
        };
      }
      window.onload = refresh;
    </script>
  </body>
</html>
